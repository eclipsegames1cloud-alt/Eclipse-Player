name: eclipse_player
description: Eclipse Player - Premium Video + Audio + Download Manager Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  get: ^4.6.6
  
  # Networking & HTTP
  http: ^1.1.0
  dio: ^5.4.0
  youtube_explode_dart: ^2.3.4
  
  # Media Players
  video_player: ^2.8.0
  audioplayers: ^5.2.0
  audio_session: ^0.1.16
  just_audio: ^0.9.40
  
  # Storage & Database
  path_provider: ^2.1.1
  path: ^1.8.3
  sqflite: ^2.3.3
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Web & Browsing
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.4
  
  # Security
  local_auth: ^2.1.8
  
  # UI & Widgets
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  
  # Sharing & Utils
  share_plus: ^7.2.2
  intl: ^0.19.0
  uuid: ^4.1.0
  image_picker: ^0.8.7+5
  image: ^4.1.6
  shared_preferences: ^2.2.3
  
  # Device & Platform
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon.jpg