- name: Build APK
        run: |
          if [ -f "lib/main.dart" ]; then
            flutter build apk --release
          else
            echo "Searching for main file..."
            MAIN_FILE=$(find lib -name "*.dart" | xargs grep -l "void main" | head -n 1)
            if [ -z "$MAIN_FILE" ]; then
              echo "Error: Could not find a file with void main() in lib/"
              exit 1
            fi
            echo "Found main file at: $MAIN_FILE"
            flutter build apk --release -t $MAIN_FILE
          fi
